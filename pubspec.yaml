name: my_finance
description: A comprehensive Flutter finance management app with arcade-style dark theme UI
version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'
    flutter: '>=3.10.0'

dependencies:
    flutter:
        sdk: flutter

    # State Management
    provider: ^6.1.1

    # Local Storage
    hive: ^2.2.3
    hive_flutter: ^1.1.0
    path_provider: ^2.1.1

    # Charts and Analytics
    fl_chart: ^0.64.0

    # UI Components
    cupertino_icons: ^1.0.6
    google_fonts: ^6.1.0
    animations: ^2.0.11
    flutter_staggered_animations: ^1.1.1

    # Utilities
    intl: ^0.18.1
    uuid: ^4.1.0
    shared_preferences: ^2.2.2

    # Currency
    currency_picker: ^2.0.16

dev_dependencies:
    flutter_test:
        sdk: flutter

    # Code Generation
    hive_generator: ^2.0.1
    build_runner: ^2.4.7

    # Linting
    flutter_lints: ^3.0.0
    flutter_launcher_icons: ^0.13.1

flutter:
    uses-material-design: true

    assets:
        - assets/images/
        - assets/icons/

    fonts:
        - family: Orbitron
          fonts:
              - asset: assets/fonts/Orbitron-Regular.ttf
              - asset: assets/fonts/Orbitron-Bold.ttf
                weight: 700

flutter_launcher_icons:
    android: true
    ios: true
    image_path: 'assets/icons/app_icon.png'
    web:
        generate: true
        image_path: 'assets/icons/app_icon.png'
        background_color: '#2D1B69'
        theme_color: '#9D4EDD'
